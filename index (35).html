<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi formation</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root { color-scheme: light dark; --vert:#2E9E4F; --orange:#F28C28; --rouge:#D64545; --trait:rgba(128,128,128,.35); }
  html,body { margin:0; padding:0; background:transparent; font:14px system-ui,Segoe UI,Arial,sans-serif; color:CanvasText; }
  body { padding:10px 14px; }
  .titre { font-size:18px; font-weight:700; margin:0 0 10px; }
  .legende { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px; font-size:13px; }
  .legende span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; background:var(--c); }
  .ligne { display:grid; grid-template-columns:minmax(120px,200px) 1fr minmax(110px,150px); gap:10px; align-items:center; margin:7px 0; }
  .nom { font-weight:600; }
  .barre { display:flex; height:24px; border-radius:4px; overflow:hidden; background:var(--rouge); outline:1px solid var(--trait); }
  .barre div { height:100%; }
  .f { background:var(--vert); } .p { background:var(--orange); } .r { background:var(--rouge); }
  .chiffres { font-size:12px; text-align:right; line-height:1.25; }
  .chiffres b { font-size:14px; }
  .total { border-top:1px solid var(--trait); padding-top:8px; margin-top:12px; }
  .info { opacity:.7; padding:20px 0; }
</style>
</head>
<body>
<div id="app"><div class="info">Chargement… (la table doit contenir les colonnes Profil, Objectif, Forme, Planifie).</div></div>
<script>
grist.ready({ requiredAccess: 'read table' });

const app = document.getElementById('app');
const fmt = n => Math.round(n).toLocaleString('fr-FR');
const pct = (a, b) => b > 0 ? (100 * a / b) : 0;
const pf = x => (Math.round(x * 10) / 10).toLocaleString('fr-FR') + ' %';

function ligne(nom, obj, forme, plan, cls) {
  // on plafonne pour que les 3 parts tiennent dans 100 %
  const f = Math.min(pct(forme, obj), 100);
  const p = Math.min(pct(plan, obj), 100 - f);
  const reste = Math.max(obj - forme - plan, 0);
  return `<div class="ligne ${cls||''}">
    <div class="nom">${nom}</div>
    <div class="barre" title="Formés ${fmt(forme)} · Planifiés ${fmt(plan)} · Reste ${fmt(reste)} (objectif ${fmt(obj)})">
      <div class="f" style="width:${f}%"></div><div class="p" style="width:${p}%"></div>
    </div>
    <div class="chiffres"><b>${pf(pct(forme, obj))}</b> formés<br>${fmt(forme)} / ${fmt(obj)} · plan. ${fmt(plan)}</div>
  </div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

grist.onRecords(function (records) {
  const rows = records.map(r => ({ Libelle: r.Profil, Objectif: r.Objectif, Forme: r.Forme, Planifie: r.Planifie }));
  // regroupe par libellé (utile si le widget n'est pas filtré : somme sur tous les BEF)
  const ordre = [], g = {};
  for (const r of rows) {
    const k = r.Libelle == null || r.Libelle === '' ? '(vide)' : String(r.Libelle);
    if (!g[k]) { g[k] = { o:0, f:0, p:0 }; ordre.push(k); }
    g[k].o += +r.Objectif || 0; g[k].f += +r.Forme || 0; g[k].p += +r.Planifie || 0;
  }
  const nomTitre = r => {
    if (r.Titre) return String(r.Titre);
    if (r.Dept_nom) return String(r.Dept_nom);
    if (r.BEF_nom) {
      const d = (typeof r.Departement === 'string' && r.Departement) ? ' · ' + r.Departement : '';
      return String(r.BEF_nom) + d;
    }
    return '';
  };
  const titres = [...new Set(records.map(nomTitre).filter(t => t))];
  const titre = titres.length === 1 ? titres[0] : 'Académie de Normandie';
  let to = 0, tf = 0, tp = 0, html = `<div class="titre">${esc(titre)}</div><div class="legende">
    <span style="--c:var(--vert)">Formés</span><span style="--c:var(--orange)">Planifiés</span><span style="--c:var(--rouge)">Reste à former</span></div>`;
  for (const k of ordre) { const v = g[k]; to += v.o; tf += v.f; tp += v.p; html += ligne(esc(k), v.o, v.f, v.p); }
  if (ordre.length > 1) html += ligne('Ensemble', to, tf, tp, 'total');
  app.innerHTML = ordre.length ? html : '<div class="info">Aucune donnée pour cette sélection.</div>';
});
</script>
</body>
</html>
